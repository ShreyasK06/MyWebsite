<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shreyas Kakkar | ML Engineer & Builder</title>
<meta name="description" content="Portfolio of Shreyas Kakkar — software engineer, ML researcher, and builder of interactive tools." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>

<!-- Intro: words appear one by one, then glitch and dissolve into the site -->
<div class="intro-container" id="intro" aria-hidden="true">
  <div class="intro-text-box" id="introBox">
    <div class="words-container" id="introWords"></div>
  </div>
</div>

<!-- Drifting particle background (visible behind the hero) -->
<canvas id="bgCanvas" class="bg-canvas" aria-hidden="true"></canvas>

<!-- Cursor fluid simulation -->
<div class="fluid-wrap" aria-hidden="true"><canvas id="fluid"></canvas></div>

<!-- Circular cursor shown over project previews -->
<div class="view-cursor" id="viewCursor" aria-hidden="true">
  <div class="view-cursor-ring">
    <div class="view-cursor-core">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>
    </div>
    <svg class="view-cursor-text" viewBox="0 0 100 100">
      <defs><path id="cursorCircle" d="M50,50 m-38,0 a38,38 0 1,1 76,0 a38,38 0 1,1 -76,0"/></defs>
      <text><textPath href="#cursorCircle">VIEW PROJECT • VIEW PROJECT • VIEW PROJECT •</textPath></text>
    </svg>
  </div>
</div>

<main class="site" id="site">

  <!-- Header -->
  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <button type="button" class="brand text-gradient" data-scroll="home">Shreyas Kakkar</button>
      <nav class="pill-nav" id="pillNav">
        <span class="pill-highlight" id="pillHighlight"></span>
        <button type="button" data-scroll="home">Home</button>
        <button type="button" data-scroll="about">About</button>
        <button type="button" data-scroll="skills">Skills</button>
        <button type="button" data-scroll="projects">Projects</button>
      </nav>
      <button type="button" class="menu-btn" id="menuBtn" aria-label="Toggle menu" aria-expanded="false">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
    <div class="mobile-menu" id="mobileMenu">
      <button type="button" data-scroll="home">Home</button>
      <button type="button" data-scroll="about">About</button>
      <button type="button" data-scroll="skills">Skills</button>
      <button type="button" data-scroll="projects">Projects</button>
    </div>
  </header>

  <!-- Terminal-style scroll progress (appears after scrolling) -->
  <div class="scroll-progress" id="scrollProgress">
    <div class="sp-inner">
      <div class="sp-pct"><span class="sp-arrow">➜</span><span class="sp-num" id="spNum">0%</span></div>
      <div class="sp-track">
        <div class="sp-fill" id="spFill"><code id="spCrumbs"><span class="blink">_</span></code></div>
        <code class="sp-remaining" id="spRemaining">100% remaining</code>
      </div>
      <div class="sp-menu" id="spMenu">
        <button type="button" class="sp-menu-btn" id="spMenuBtn" aria-label="Navigation menu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="sp-dropdown" id="spDropdown">
          <button type="button" data-scroll="home">intro</button>
          <button type="button" data-scroll="about">about me</button>
          <button type="button" data-scroll="skills">skills</button>
          <button type="button" data-scroll="projects">projects</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Hero -->
  <section id="home" class="hero">
    <div class="container hero-grid">
      <div class="hero-copy reveal">
        <p class="hero-hey reveal">Hey, I'm Shreyas</p>
        <h1 class="hero-type reveal"><span id="typeText"></span><span class="caret">|</span></h1>
        <h2 class="hero-tag text-gradient reveal" id="heroTag"></h2>
        <p class="hero-summary reveal" id="heroSummary"></p>
        <div class="hero-cta reveal">
          <a href="mailto:shreyaskakkar@gmail.com" class="btn btn-primary" id="ctaMail">
            Get in Touch
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
          </a>
          <a href="#projects" class="btn btn-outline" data-scroll="projects">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            View Projects
          </a>
        </div>
        <div class="hero-social reveal" id="heroSocial"></div>
      </div>
      <div class="hero-photo reveal">
        <div class="photo-wrap">
          <div class="photo-glow"></div>
          <div class="photo-card">
            <div class="bg-grid"></div>
            <div class="photo-inner" id="photoInner">
              <div class="photo-mark">SK</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="scroll-down"><button type="button" data-scroll="about" aria-label="Scroll to about">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button></div>
  </section>

  <!-- About -->
  <section id="about" class="section about-section">
    <div class="container section-container">
      <h2 class="section-title text-gradient reveal">About Me</h2>
      <div class="about-grid">
        <div class="about-card reveal from-left" id="aboutCard"></div>
        <div class="about-side reveal from-right" id="aboutSide"></div>
      </div>
    </div>
  </section>

  <!-- Skills -->
  <section id="skills" class="section skills-section">
    <div class="container section-container">
      <h2 class="section-title text-gradient reveal">Skills</h2>
      <div class="tabs reveal">
        <div class="tablist" id="skillTabs" role="tablist"></div>
        <div class="tabpanel" id="skillPanel" role="tabpanel"></div>
      </div>
    </div>
  </section>

  <!-- Projects -->
  <section id="projects" class="projects-section">
    <div class="projects-inner">
      <h2 class="section-title pt-8 reveal">Stuff I Built</h2>
      <div id="projectList"></div>
    </div>
  </section>

</main>

<script src="data.js?v=3"></script>
<script src="fluid.js?v=3"></script>
<script src="script.js?v=3"></script>
</body>
</html>
